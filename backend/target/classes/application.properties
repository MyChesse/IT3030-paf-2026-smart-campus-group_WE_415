# Datasource configuration (override via environment variables when needed)
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:smartcampus_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}






# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Multipart upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Ticket attachment storage
app.ticket.attachments.upload-dir=${TICKET_UPLOAD_DIR:uploads/tickets}
app.ticket.attachments.max-file-size=5242880

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.lk.sliit=DEBUG