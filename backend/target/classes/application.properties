# App
spring.application.name=smart-uni
server.port=8081

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:smartcampus_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-value-here}
app.jwt.expiration-ms=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Register this backend callback URI in Google Cloud Console for local development.
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}

# OAuth2 Redirect URIs (update these for production)
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth2/callback}
app.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login?error=oauth_failed}

# CORS Configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Datasource configuration (override via environment variables when needed)
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:smartcampus_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}






# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Multipart upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Ticket attachment storage
app.ticket.attachments.upload-dir=${TICKET_UPLOAD_DIR:uploads/tickets}
app.ticket.attachments.max-file-size=5242880

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.com.smartuni.api=DEBUG
logging.level.com.smartuni=DEBUG

#Forgor Password reset email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true